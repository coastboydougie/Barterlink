{% extends "base.html" %}
{% block title %}Post a Listing{% endblock %}

{% block content %}
<div class="container page narrow">
    <h1>Post a Listing</h1>
    <p class="page-intro">Tell people what you can offer and what you’re looking for in return.</p>

    <form method="post" class="form">
        <div class="form-group">
            <label for="listing_type">Type of listing *</label>
            <select name="listing_type" id="listing_type" required>
                <option value="">Choose one…</option>
                <option value="service_for_goods">I offer a Service / Skill → looking for Goods</option>
                <option value="goods_for_service">I offer Goods / Products → looking for a Job / Service</option>
            </select>
        </div>

        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" name="title" id="title" required placeholder="e.g. Bike repair or Fresh vegetables">
        </div>

        <div class="form-group">
            <label for="what_i_offer">What I offer *</label>
            <textarea name="what_i_offer" id="what_i_offer" rows="3" required placeholder="Be specific: hours, quantity, condition…"></textarea>
        </div>

        <div class="form-group">
            <label for="what_i_want">What I want in return *</label>
            <textarea name="what_i_want" id="what_i_want" rows="3" required placeholder="Describe the goods or the job you need done"></textarea>
        </div>

        <div class="form-group">
            <label for="description">Full description *</label>
            <textarea name="description" id="description" rows="5" required placeholder="Add more details, experience, availability, etc."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <select name="category" id="category">
                    <option value="">Select…</option>
                    <option value="Home & Repair">Home & Repair</option>
                    <option value="Food & Produce">Food & Produce</option>
                    <option value="Education">Education</option>
                    <option value="Tech & Digital">Tech & Digital</option>
                    <option value="Creative">Creative</option>
                    <option value="Childcare & Pets">Childcare & Pets</option>
                    <option value="Transport">Transport</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" name="location" id="location" placeholder="City, State">
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Publish Listing</button>
    </form>
</div>
{% endblock %}
